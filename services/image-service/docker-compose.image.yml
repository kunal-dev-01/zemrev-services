# ============================================================================
# FILE: services/image-service/docker-compose.image.yml
# PURPOSE: Image Service (connects to shared Redis)
# ============================================================================

version: '3.9'

services:
  image-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zemrev_image_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      # Connect to external Redis (change IP for your VM)
      - REDIS_URL=redis://REDIS_VM_IP:6379
      - QUEUE_NAME=zemrev_image_jobs
      - QUEUE_MAX_WORKERS=4
      - LOG_LEVEL=info
    networks:
      - zemrev_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  zemrev_network:
    external: true
    name: zemrev_network